name: Python tests

on:
  push:
    paths:
      - '**.py'
      - 'xano/**'
      - 'requirements.txt'
      - '.streamlit/secrets.toml.example'
      - 'docs/xano-import-order.md'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - '**.py'
      - 'xano/**'
      - 'requirements.txt'
      - '.streamlit/secrets.toml.example'
      - 'docs/xano-import-order.md'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - run: python -m pytest -q
