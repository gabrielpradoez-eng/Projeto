schema: spec-driven

githubCopilot:
  cloudAgent: true

context: |
  Project: FilaSmart - Sistema de Gestão de Filas e Atendimentos

  Domain: Sistema para emissão de senhas, controle de filas em tempo real, chamadas em painéis públicos, gestão de atendimento por guichê e métricas de desempenho.

  Tech stack:
    - Backend & Banco de Dados: Xano (APIs REST e logica de negocio; atualizacao por polling no Streamlit)
    - Frontend / Interfaces: Streamlit (Python); Reflex nao utilizado no deploy atual
    - Comunicação / Integração: Consumo das APIs REST e WebSockets do Xano via Python

  Architecture: O Xano atua como o backend centralizador das regras de negócio, persistência de dados e controle de chamadas. As interfaces em Streamlit atuam como as aplicações cliente (Totem de atendimento, Painel de Chamadas público, Painel do Atendente e Dashboard Administrativo), consumindo os serviços do Xano.

  Development: Implementar mudanças de forma incremental utilizando a metodologia OpenSpec.

  Language: Escrever todos os artefatos OpenSpec em português brasileiro (pt-BR).

rules:
  proposal:
    - Descrever claramente o problema, objetivo e escopo da mudança.
    - Explicitar o que está fora do escopo (Non-goals).

  specs:
    - Escrever requisitos verificáveis com cenários claros.

  tasks:
    - Dividir as tarefas em etapas pequenas, objetivas e verificáveis.

operations:
  apply:
    guidance:
      - Executar verificações e testes relevantes antes de dar a tarefa como concluída.

  archive:
    guidance:
      - Confirmar que a implementação atende exatamente o que foi especificado nas specs.